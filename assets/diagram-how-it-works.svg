<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <radialGradient id="hbg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#150a24"/>
      <stop offset="55%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#05020c"/>
    </radialGradient>
    <linearGradient id="hTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe7c2"/>
      <stop offset="50%" stop-color="#ffb3d9"/>
      <stop offset="100%" stop-color="#a5d9ff"/>
    </linearGradient>
    <filter id="hGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hGlowBig" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a5d9ff"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#hbg)"/>
  <g fill="#ffffff" opacity="0.6">
    <circle cx="50" cy="40" r="1.2"/><circle cx="1150" cy="50" r="1.2"/>
    <circle cx="90" cy="500" r="1.1"/><circle cx="1120" cy="510" r="1.1"/>
    <circle cx="600" cy="30" r="1"/><circle cx="30" cy="260" r="1"/><circle cx="1170" cy="300" r="1"/>
  </g>

  <text x="600" y="46" text-anchor="middle" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="700" font-size="30" fill="url(#hTitle)" letter-spacing="3">HOW THE TUNNEL WORKS</text>
  <text x="600" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#c9b8d6" letter-spacing="2" opacity="0.85">a stylized top-down schematic of the scene, not a literal 3D render</text>

  <!-- ===================== TOP: side/depth view along Z ===================== -->
  <g font-family="Segoe UI, sans-serif">
    <!-- baseline axis -->
    <line x1="120" y1="230" x2="1080" y2="230" stroke="#4a3a5c" stroke-width="1.5" stroke-dasharray="2 6"/>
    <text x="1085" y="234" font-size="13" fill="#8a7a99">+Z (behind)</text>
    <text x="70" y="234" font-size="13" fill="#8a7a99" text-anchor="end">&#8722;Z (ahead)</text>

    <!-- receding rings, ship-fixed camera perspective: big near ship, shrink toward spawn -->
    <g stroke="#a5d9ff" fill="none">
      <ellipse cx="330" cy="230" rx="16" ry="72" stroke-width="2.4" opacity="0.95" filter="url(#hSoft)"/>
      <ellipse cx="430" cy="230" rx="14" ry="64" stroke-width="2.2" opacity="0.8"/>
      <ellipse cx="530" cy="230" rx="12.5" ry="57" stroke-width="2" opacity="0.68"/>
      <ellipse cx="630" cy="230" rx="11" ry="50" stroke-width="1.8" opacity="0.56"/>
      <ellipse cx="730" cy="230" rx="9.5" ry="44" stroke-width="1.6" opacity="0.46"/>
      <ellipse cx="830" cy="230" rx="8.5" ry="38" stroke-width="1.4" opacity="0.36"/>
      <ellipse cx="920" cy="230" rx="7.5" ry="33" stroke-width="1.2" opacity="0.28"/>
      <ellipse cx="1000" cy="230" rx="6.5" ry="28" stroke-width="1" opacity="0.2"/>
    </g>
    <text x="330" y="322" text-anchor="middle" font-size="11.5" fill="#8a7a99">ring[0]</text>
    <text x="430" y="322" text-anchor="middle" font-size="11.5" fill="#8a7a99" opacity="0.85">ring[1]</text>
    <text x="530" y="322" text-anchor="middle" font-size="11.5" fill="#8a7a99" opacity="0.7">ring[2] &#8230; ring[17]</text>

    <!-- spacing bracket between two rings -->
    <line x1="330" y1="340" x2="430" y2="340" stroke="#6a5a7c" stroke-width="1"/>
    <line x1="330" y1="335" x2="330" y2="345" stroke="#6a5a7c" stroke-width="1"/>
    <line x1="430" y1="335" x2="430" y2="345" stroke="#6a5a7c" stroke-width="1"/>
    <text x="380" y="356" text-anchor="middle" font-size="11.5" fill="#6a5a7c">RING_SPACING = 7</text>

    <!-- ship at near ring -->
    <g filter="url(#hGlowBig)">
      <path d="M330 205 L344 244 L330 234 L316 244 Z" fill="#fff6e6"/>
    </g>
    <path d="M330 205 L344 244 L330 234 L316 244 Z" fill="#fff6e6"/>
    <text x="330" y="185" text-anchor="middle" font-size="13" fill="#fff6e6" font-weight="700" letter-spacing="1">SHIP</text>
    <text x="330" y="170" text-anchor="middle" font-size="10.5" fill="#8a7a99">world-space (shipX, shipY, shipZ)</text>

    <!-- camera behind and slightly above, chasing with lag -->
    <g filter="url(#hGlow)">
      <rect x="196" y="118" width="26" height="18" rx="3" fill="none" stroke="#ffb3d9" stroke-width="2"/>
      <path d="M222 122 L236 116 L236 138 L222 132 Z" fill="none" stroke="#ffb3d9" stroke-width="2"/>
    </g>
    <text x="180" y="105" text-anchor="middle" font-size="12" fill="#ffb3d9" font-weight="700" letter-spacing="1">CAMERA</text>
    <text x="180" y="150" text-anchor="middle" font-size="10.5" fill="#8a7a99">chases ship pos.</text>
    <text x="180" y="163" text-anchor="middle" font-size="10.5" fill="#8a7a99">+ lag &#38; bank tilt</text>
    <path d="M236 127 C270 150, 300 190, 322 213" stroke="#ffb3d9" stroke-width="1.4" fill="none" stroke-dasharray="3 4" marker-end="url(#arrow)" opacity="0.8"/>

    <!-- recycle marker just behind ship -->
    <line x1="300" y1="200" x2="300" y2="270" stroke="#6dff9e" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.75"/>
    <text x="300" y="290" text-anchor="middle" font-size="11" fill="#6dff9e">RECYCLE_MARGIN</text>
    <text x="300" y="304" text-anchor="middle" font-size="10" fill="#6dff9e" opacity="0.8">objects behind here return to pool</text>

    <!-- obstacle + orb + powerup markers scattered between ship and spawn -->
    <g filter="url(#hGlow)">
      <circle cx="470" cy="205" r="5" fill="#7ee8ff"/>
      <path d="M615 250 l7 -8 l7 8 l-7 8 z" fill="#ff5c5c"/>
      <circle cx="760" cy="215" r="4.5" fill="#7ee8ff"/>
      <path d="M840 245 l6.5 -7 l6.5 7 l-6.5 7 z" fill="#ff5c5c"/>
      <polygon points="700,255 706,244 712,255" fill="#ffd76d"/>
    </g>

    <!-- spawn marker far ahead -->
    <line x1="1000" y1="190" x2="1000" y2="270" stroke="#ff5c5c" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.75"/>
    <text x="1000" y="290" text-anchor="middle" font-size="11" fill="#ff8f8f">SPAWN_AHEAD &#8776; 52u</text>
    <text x="1000" y="304" text-anchor="middle" font-size="10" fill="#ff8f8f" opacity="0.8">obstacle / orb / power-up pool</text>

    <!-- motion arrow -->
    <path d="M960 380 L360 380" stroke="#a5d9ff" stroke-width="1.6" marker-end="url(#arrow)" opacity="0.85"/>
    <text x="660" y="400" text-anchor="middle" font-size="12.5" fill="#a5d9ff" letter-spacing="1">ship advances through world &#8226; speed ramps BASE_SPEED &#8594; MAX_SPEED</text>
  </g>

  <!-- ===================== BOTTOM: top-down XY play-disc inset ===================== -->
  <g font-family="Segoe UI, sans-serif">
    <line x1="60" y1="430" x2="1140" y2="430" stroke="#2a1e38" stroke-width="1"/>
    <text x="600" y="458" text-anchor="middle" font-size="15" fill="#e2d4eb" font-weight="700" letter-spacing="2">PLAY DISC (X/Y, seen head-on)</text>

    <circle cx="220" cy="520" r="0" fill="none"/>
    <g transform="translate(220,522)">
      <circle r="58" fill="none" stroke="#4a3a5c" stroke-width="1.5" stroke-dasharray="3 5"/>
      <text x="0" y="-66" text-anchor="middle" font-size="10.5" fill="#6a5a7c">PLAY_RADIUS</text>
      <circle cx="14" cy="-10" r="3" fill="#7ee8ff" filter="url(#hGlow)"/>
      <path d="M-20,20 l6,-7 l6,7 l-6,7 z" fill="#ff5c5c" filter="url(#hGlow)"/>
      <g filter="url(#hGlow)"><path d="M-1 -7 L5 8 L-1 3 L-7 8 Z" fill="#fff6e6"/></g>
    </g>
    <text x="220" y="600" text-anchor="middle" font-size="11" fill="#8a7a99">ship eases toward pointer / joystick target each frame</text>

    <g transform="translate(500,522)">
      <text x="0" y="-40" text-anchor="middle" font-size="12.5" fill="#e2d4eb" font-weight="700">INPUT &#8594; TARGET &#8594; SHIP</text>
      <text x="0" y="-16" text-anchor="middle" font-size="11" fill="#8a7a99">mouse / touch-drag sets target(x,y) directly</text>
      <text x="0" y="4" text-anchor="middle" font-size="11" fill="#8a7a99">arrows / WASD / joystick nudge target(x,y)</text>
      <text x="0" y="24" text-anchor="middle" font-size="11" fill="#8a7a99">ship position eases toward target every frame</text>
      <text x="0" y="44" text-anchor="middle" font-size="11" fill="#8a7a99">(clamped to PLAY_RADIUS, tilt/bank from velocity)</text>
    </g>

    <g transform="translate(870,522)">
      <text x="0" y="-40" text-anchor="middle" font-size="12.5" fill="#e2d4eb" font-weight="700">COLLISION CHECK</text>
      <text x="0" y="-16" text-anchor="middle" font-size="11" fill="#8a7a99">each active object within &#177;0.85&#8211;0.9u of shipZ</text>
      <text x="0" y="4" text-anchor="middle" font-size="11" fill="#8a7a99">tests XY distance to ship against its radius</text>
      <text x="0" y="24" text-anchor="middle" font-size="11" fill="#8a7a99">hit &#8594; shield-absorb or crash &#183; near-radius &#8594; near-miss bonus</text>
      <text x="0" y="44" text-anchor="middle" font-size="11" fill="#8a7a99">orb / power-up in range &#8594; collected</text>
    </g>
  </g>
</svg>
