<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#1a0e2c"/>
      <stop offset="55%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#05020c"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe7c2"/>
      <stop offset="45%" stop-color="#ffb3d9"/>
      <stop offset="75%" stop-color="#a5d9ff"/>
      <stop offset="100%" stop-color="#ffe7c2"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#a5d9ff" stop-opacity="0"/>
      <stop offset="78%" stop-color="#a5d9ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a5d9ff" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="48%" r="14%">
      <stop offset="0%" stop-color="#ffe7c2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe7c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="52" r="1.4" opacity="0.9"/>
    <circle cx="140" cy="120" r="1" opacity="0.6"/>
    <circle cx="230" cy="40" r="1.6" opacity="0.8"/>
    <circle cx="310" cy="180" r="1" opacity="0.5"/>
    <circle cx="90" cy="260" r="1.2" opacity="0.7"/>
    <circle cx="1000" cy="60" r="1.4" opacity="0.9"/>
    <circle cx="1080" cy="150" r="1" opacity="0.6"/>
    <circle cx="1140" cy="280" r="1.6" opacity="0.8"/>
    <circle cx="960" cy="320" r="1" opacity="0.5"/>
    <circle cx="1050" cy="340" r="1.2" opacity="0.7"/>
    <circle cx="30" cy="340" r="1" opacity="0.6"/>
    <circle cx="200" cy="330" r="1.3" opacity="0.7"/>
    <circle cx="1150" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="440" cy="30" r="1" opacity="0.6"/>
    <circle cx="770" cy="380" r="1.1" opacity="0.6"/>
    <circle cx="620" cy="380" r="1" opacity="0.5"/>
  </g>

  <!-- tunnel rings -->
  <g fill="none" stroke="#a5d9ff" opacity="0.32">
    <ellipse cx="600" cy="222" rx="600" ry="250" stroke-width="1.5"/>
    <ellipse cx="600" cy="222" rx="470" ry="195" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="600" cy="222" rx="340" ry="140" stroke-width="1.5" opacity="0.32"/>
    <ellipse cx="600" cy="222" rx="210" ry="87" stroke-width="1.5" opacity="0.2"/>
  </g>
  <rect width="1200" height="420" fill="url(#ringGlow)"/>
  <circle cx="600" cy="222" r="120" fill="url(#coreGlow)"/>

  <!-- orb + rock accents -->
  <circle cx="150" cy="340" r="7" fill="#7ee8ff" filter="url(#glow)"/>
  <circle cx="1060" cy="96" r="6" fill="#7ee8ff" filter="url(#glow)" opacity="0.85"/>
  <circle cx="980" cy="262" r="8" fill="#ff5c5c" filter="url(#glow)" opacity="0.9"/>
  <circle cx="115" cy="150" r="5" fill="#ff5c5c" filter="url(#glow)" opacity="0.75"/>
  <circle cx="1115" cy="200" r="5.5" fill="#7ee8ff" filter="url(#glow)" opacity="0.8"/>

  <!-- ship silhouette drifting on-center -->
  <g filter="url(#bigglow)" opacity="0.95">
    <path d="M600 178 L620 232 L600 220 L580 232 Z" fill="#ffe7c2"/>
  </g>
  <path d="M600 178 L620 232 L600 220 L580 232 Z" fill="#fff6e6"/>

  <!-- title -->
  <text x="600" y="210" text-anchor="middle" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="900" font-size="96" fill="url(#title)" filter="url(#softglow)" letter-spacing="10">NOVA DRIFT</text>

  <text x="600" y="260" text-anchor="middle" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="700" font-size="19" fill="#e2d4eb" letter-spacing="7" opacity="0.85">AN ENDLESS ARCADE SPACE-TUNNEL DODGER</text>

  <!-- powerup legend -->
  <text x="600" y="335" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="25" fill="#f5e9e9" opacity="0.95">🛡️ Shield &#160;&#160;&#160; 🧲 Magnet &#160;&#160;&#160; ✨ x2 Score &#160;&#160;&#160; 💥 Near-Miss Bonus</text>

  <!-- bottom hairline -->
  <rect x="330" y="376" width="540" height="1" fill="#a5d9ff" opacity="0.25"/>
  <text x="600" y="402" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" letter-spacing="3" fill="#c9b8d6" opacity="0.7">THREE.JS &#8226; REAL BLOOM &#8226; SYNTHESIZED AUDIO &#8226; NO BUILD STEP</text>
</svg>
