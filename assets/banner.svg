<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#150a24"/>
      <stop offset="55%" stop-color="#0a0514"/>
      <stop offset="100%" stop-color="#05020c"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe7c2"/>
      <stop offset="45%" stop-color="#ffb3d9"/>
      <stop offset="75%" stop-color="#a5d9ff"/>
      <stop offset="100%" stop-color="#ffe7c2"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5d9ff" stop-opacity="0"/>
      <stop offset="78%" stop-color="#a5d9ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a5d9ff" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="52" r="1.4" opacity="0.9"/>
    <circle cx="140" cy="120" r="1" opacity="0.6"/>
    <circle cx="230" cy="40" r="1.6" opacity="0.8"/>
    <circle cx="310" cy="180" r="1" opacity="0.5"/>
    <circle cx="90" cy="260" r="1.2" opacity="0.7"/>
    <circle cx="1000" cy="60" r="1.4" opacity="0.9"/>
    <circle cx="1080" cy="150" r="1" opacity="0.6"/>
    <circle cx="1140" cy="280" r="1.6" opacity="0.8"/>
    <circle cx="960" cy="320" r="1" opacity="0.5"/>
    <circle cx="1050" cy="340" r="1.2" opacity="0.7"/>
    <circle cx="30" cy="340" r="1" opacity="0.6"/>
    <circle cx="200" cy="330" r="1.3" opacity="0.7"/>
    <circle cx="1150" cy="40" r="1.1" opacity="0.6"/>
  </g>

  <!-- tunnel rings -->
  <g fill="none" stroke="#a5d9ff" opacity="0.35">
    <ellipse cx="600" cy="210" rx="560" ry="230" stroke-width="1.5"/>
    <ellipse cx="600" cy="210" rx="430" ry="175" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="600" cy="210" rx="300" ry="120" stroke-width="1.5" opacity="0.3"/>
  </g>
  <rect width="1200" height="400" fill="url(#ringGlow)"/>

  <!-- orb + rock accents -->
  <circle cx="150" cy="330" r="7" fill="#7ee8ff" filter="url(#glow)"/>
  <circle cx="1060" cy="90" r="6" fill="#7ee8ff" filter="url(#glow)" opacity="0.85"/>
  <circle cx="980" cy="250" r="8" fill="#ff5c5c" filter="url(#glow)" opacity="0.9"/>

  <!-- title -->
  <text x="600" y="200" text-anchor="middle" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="900" font-size="92" fill="url(#title)" filter="url(#softglow)" letter-spacing="10">NOVA DRIFT</text>

  <text x="600" y="250" text-anchor="middle" font-family="Orbitron, 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#e2d4eb" letter-spacing="7" opacity="0.85">AN ENDLESS ARCADE SPACE-TUNNEL DODGER</text>

  <!-- powerup legend -->
  <text x="600" y="320" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" fill="#f5e9e9" opacity="0.95">🛡️ Shield &#160;&#160;&#160; 🧲 Magnet &#160;&#160;&#160; ✨ x2 Score &#160;&#160;&#160; 💥 Near-Miss Bonus</text>
</svg>
