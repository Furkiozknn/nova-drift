<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Nova Drift — bir ışık tünelinde engellerden kaçıp enerji küreleri topladığın hızlı bir uzay koşusu.">
<meta name="theme-color" content="#05020c">
<title>Nova Drift</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="manifest" href="manifest.json">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Nova Drift">
<meta property="og:description" content="Nova Drift — bir ışık tünelinde engellerden kaçıp enerji küreleri topladığın hızlı bir uzay koşusu.">
<meta property="og:url" content="https://furkiozknn.github.io/nova-drift/">
<meta property="og:image" content="https://furkiozknn.github.io/nova-drift/assets/og-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Nova Drift">
<meta name="twitter:description" content="Nova Drift — bir ışık tünelinde engellerden kaçıp enerji küreleri topladığın hızlı bir uzay koşusu.">
<meta name="twitter:image" content="https://furkiozknn.github.io/nova-drift/assets/og-preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hitFlash" aria-hidden="true"></div>

<button id="muteBtn" aria-label="Sesi kapat/aç">🔊</button>
<button id="pauseBtn" aria-label="Duraklat">⏸</button>

<div id="hud">
  <div id="score">0</div>
  <div id="best">EN İYİ: 0</div>
  <div id="modeTag" class="modeTag hidden">GÜNLÜK MOD</div>
  <div id="powerups"></div>
</div>

<div id="joystick" class="hidden">
  <div id="joystickKnob"></div>
</div>

<div id="startScreen" class="overlay">
  <h1>NOVA DRIFT</h1>
  <p class="tagline">bir ışık tünelinde hayatta kal</p>
  <div class="controls">
    <span>🖱️ / 👆 sürükle</span>
    <span>⌨️ ok tuşları · WASD</span>
    <span class="escHint">⏸ ESC duraklat</span>
  </div>
  <p class="legend"><span class="dot orb"></span> topla &nbsp; <span class="dot rock"></span> kaçın</p>
  <div class="legend powerlegend">
    <img class="icon" src="assets/icon_shield.png" alt=""> kalkan &nbsp;
    <img class="icon" src="assets/icon_magnet.png" alt=""> mıknatıs &nbsp;
    <img class="icon" src="assets/icon_mult.png" alt=""> x2 puan
  </div>
  <button id="startBtn">BAŞLA</button>
  <button id="dailyToggleBtn" class="modeToggle" type="button" aria-pressed="false">GÜNLÜK MOD: KAPALI</button>
  <div id="dailyInfoStart" class="dailyInfo hidden">bugünün rekoru: <span id="dailyBestStart">0</span></div>
  <div id="leaderboardStart" class="leaderboard"></div>
</div>

<div id="gameOverScreen" class="overlay hidden">
  <h2>ÇARPIŞMA</h2>
  <div id="finalScore">0</div>
  <p id="newBest" class="hidden">yeni rekor!</p>
  <button id="restartBtn">TEKRAR DENE</button>
  <div id="dailyInfoEnd" class="dailyInfo hidden">bugünün rekoru: <span id="dailyBestEnd">0</span> <span id="newDailyBest" class="hidden">(yeni günlük rekor!)</span></div>
  <div id="leaderboardEnd" class="leaderboard"></div>
</div>

<div id="pauseScreen" class="overlay hidden">
  <h2 class="pauseTitle">DURAKLATILDI</h2>
  <button id="resumeBtn">DEVAM ET</button>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
